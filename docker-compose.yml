services:
  backend:
    build:
      context: ./backend
    # Published for local debugging: curl http://localhost:8080/health
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    # The backend loads its config (a slow, simulated per-key fetch) before it
    # binds the port, so it is not reachable for several seconds after start.
    # Probe /health, which only answers once the server is actually listening,
    # so dependents can wait for readiness instead of mere container start.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 12s

  proxy:
    build:
      context: ./proxy
    # Published for local debugging: curl http://localhost:8081/nginx-health
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    # Probe nginx's own /nginx-health so dependents wait until the proxy is
    # actually accepting connections, not just until its container launched.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/nginx-health"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 5s

  test-runner:
    build:
      context: ./test-runner
    depends_on:
      proxy:
        condition: service_healthy
    environment:
      - PROXY_URL=http://proxy:80
