# Send nginx logs to the container's stdout/stderr so that
# `docker compose logs proxy` shows them on any base image.
error_log /dev/stderr warn;

# We replace the image's default nginx.conf, so we must re-declare the pid in a
# non-root-writable path. The unprivileged nginx runs as UID 101 and cannot
# write the compiled-in default /run/nginx.pid.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    upstream app_backend {
        server backend:8080;
    }

    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /nginx-health {
            default_type application/json;
            return 200 '{"proxy": "ok"}';
        }
    }
}
